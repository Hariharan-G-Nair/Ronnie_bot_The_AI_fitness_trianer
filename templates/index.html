<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Ronnie Bot</title>

<style>

body{
margin:0;
font-family:Segoe UI,Arial;
background:linear-gradient(135deg,#111827,#1f2937);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.chat-container{
width:420px;
height:620px;
background:white;
border-radius:15px;
display:flex;
flex-direction:column;
box-shadow:0 20px 40px rgba(0,0,0,0.3);
overflow:hidden;
}

.chat-header{
background:#111827;
color:white;
padding:15px;
font-size:18px;
font-weight:600;
display:flex;
justify-content:space-between;
align-items:center;
}

.clear-btn{
background:#ef4444;
border:none;
color:white;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
}

.chat-box{
flex:1;
padding:20px;
overflow-y:auto;
display:flex;
flex-direction:column;
background:#f9fafb;
}

.message{
padding:12px 15px;
margin-bottom:12px;
border-radius:12px;
max-width:80%;
line-height:1.5;
animation:fade .25s ease;
}

.user{
background:#3b82f6;
color:white;
align-self:flex-end;
}

.bot{
background:#e5e7eb;
align-self:flex-start;
}

.timestamp{
font-size:10px;
opacity:.6;
margin-top:4px;
}

.chat-input{
display:flex;
padding:12px;
border-top:1px solid #eee;
}

.chat-input input{
flex:1;
padding:12px;
border-radius:8px;
border:1px solid #ccc;
outline:none;
}

.chat-input button{
margin-left:10px;
background:#10b981;
border:none;
color:white;
padding:12px 15px;
border-radius:8px;
cursor:pointer;
}

.chat-input button:hover{
background:#059669;
}

.typing{
font-size:13px;
color:#6b7280;
margin-bottom:10px;
}

.day-title{
font-weight:bold;
font-size:15px;
margin-top:10px;
}

@keyframes fade{
from{opacity:0; transform:translateY(5px)}
to{opacity:1; transform:translateY(0)}
}

</style>

</head>

<body>

<div class="chat-container">

<div class="chat-header">
💪 Ronnie Bot
<button class="clear-btn" onclick="clearChat()">Clear</button>
</div>

<div class="chat-box" id="chatBox">

<div class="message bot">
Hi! I'm Ronnie,your AI fitness trainer. Ask me anything regarding fitness.
<div class="timestamp">now</div>
</div>

</div>

<div class="chat-input">

<input
type="text"
id="userInput"
placeholder="Ask about workouts, diet, fat loss..."
>

<button onclick="sendMessage()">Send</button>

</div>

</div>

<script>

const chatBox=document.getElementById("chatBox")
const userInput=document.getElementById("userInput")

function getTime(){
const now=new Date()
return now.getHours()+":"+String(now.getMinutes()).padStart(2,"0")
}

function formatWorkout(text){

text=text.replace(/\*\*/g,"")

const days=text.split(/Day\s\d+/)

const dayMatches=text.match(/Day\s\d+/g)

if(!dayMatches) return text.replace(/\n/g,"<br>")

let formatted=""

for(let i=0;i<dayMatches.length;i++){

formatted+=`<div class="day-title">${dayMatches[i]}</div>`

formatted+=days[i+1].replace(/\n/g,"<br>")

formatted+="<br><br>"

}

return formatted

}

function addMessage(text,sender){

const msg=document.createElement("div")

msg.classList.add("message",sender)

if(sender==="bot"){
msg.innerHTML=formatWorkout(text)+`<div class="timestamp">${getTime()}</div>`
}else{
msg.innerHTML=text+`<div class="timestamp">${getTime()}</div>`
}

chatBox.appendChild(msg)

chatBox.scrollTop=chatBox.scrollHeight

}

function showTyping(){

const typing=document.createElement("div")

typing.id="typing"

typing.classList.add("typing")

typing.innerText="Trainer is typing..."

chatBox.appendChild(typing)

chatBox.scrollTop=chatBox.scrollHeight

}

function removeTyping(){

const typing=document.getElementById("typing")

if(typing) typing.remove()

}

async function sendMessage(){

const message=userInput.value.trim()

if(!message) return

addMessage(message,"user")

userInput.value=""

showTyping()

try{

const response=await fetch("/chat",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({message})

})

const data=await response.json()

removeTyping()

addMessage(data.response,"bot")

}

catch{

removeTyping()

addMessage("Server connection error.","bot")

}

}

function clearChat(){

chatBox.innerHTML=""

addMessage("Chat cleared. Ask me anything about fitness.","bot")

}

userInput.addEventListener("keydown",function(e){

if(e.key==="Enter"){
sendMessage()
}

})

</script>

</body>

</html>
